<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leseecke</title>
  <meta name="description" content="A personal German graded reader: tap any word for its meaning and pronunciation, save it, and review it with flashcards.">
  <meta name="theme-color" content="#2f4858">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Leseecke">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Leseecke – library">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <span>Leseecke</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/" data-nav="library">Library</a>
        <a href="#/review" data-nav="review">Review <span class="badge" id="due-badge" hidden></span></a>
        <a href="#/words" data-nav="words">Words</a>
      </nav>
    </div>
  </header>

  <main id="app"><p class="loading">Loading…</p></main>

  <aside class="sheet" id="sheet" aria-hidden="true" aria-label="Word details">
    <div class="sheet-inner" id="sheet-inner"></div>
  </aside>

  <noscript><p class="panel">Leseecke needs JavaScript to run.</p></noscript>
</body>
</html>
